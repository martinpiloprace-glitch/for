<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrace rezervací</title>
    <style>
        :root {
            --primary: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --border-color: #cbd5e1;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg-gradient); padding: 40px 20px; color: var(--text-main); margin: 0; min-height: 100vh; box-sizing: border-box; }
        .container { max-width: 1000px; margin: 0 auto; }
        .section-box { background: var(--card-bg); border-radius: 20px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; }
        
        .field-label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; color: #1e293b; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; margin-bottom: 15px; }
        button { padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; background: var(--primary); color: white; width: 100%; }
        .list-item { display: flex; align-items: center; gap: 15px; padding: 15px; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 15px; background: #f8fafc; }
        .list-item img { width: 100px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: right; margin-bottom: 20px;">
        <a href="index.html" style="color: white; text-decoration: none; margin-right: 15px;">← Zpět na rezervační formulář</a>
        <button type="button" onclick="clearAllCatalog()" style="background: #dc2626; padding: 8px 15px; font-size: 14px; width: auto; margin-right: 10px;">Vyčistit katalog</button>
        <button type="button" onclick="clearAllOrders()" style="background: #dc2626; padding: 8px 15px; font-size: 14px; width: auto;">Smazat rezervace</button>
    </div>

    <div id="orders-container"></div>

    <div class="section-box">
        <h1>Správa katalogu</h1>
        <div>
            <span class="field-label">Název položky</span>
            <input type="text" id="itemName" placeholder="např. Horské kolo X1">

            <span class="field-label">Cena za den</span>
            <input type="text" id="itemPrice" placeholder="např. 500 Kč">

            <span class="field-label">Záloha</span>
            <input type="text" id="itemDeposit" placeholder="např. 2000 Kč">

            <span class="field-label">Popis produktu</span>
            <textarea id="itemDesc" placeholder="Stručný popis vlastností..."></textarea>

            <span class="field-label">Obrázek produktu</span>
            <input type="file" id="itemImage" accept="image/*">

            <button type="button" onclick="addItem()">Přidat do katalogu</button>
        </div>
        
        <h3 style="margin-top: 30px; font-size: 18px; color: #1e293b;">Karty v katalogu:</h3>
        <div id="catalog-list"></div>
    </div>
</div>

<script>
    // --- POMOCNÁ FUNKCE PRO ZMENŠENÍ OBRÁZKU ---
    function resizeImage(file, maxWidth, maxHeight, callback) {
        const reader = new FileReader();
        reader.onload = function (e) {
            const img = new Image();
            img.onload = function () {
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > maxWidth) {
                        height *= maxWidth / width;
                        width = maxWidth;
                    }
                } else {
                    if (height > maxHeight) {
                        width *= maxHeight / height;
                        height = maxHeight;
                    }
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                callback(canvas.toDataURL('image/jpeg', 0.7));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // --- REZERVACE ---
    function renderOrders() {
        const container = document.getElementById('orders-container');
        let orders = JSON.parse(localStorage.getItem('rental_orders')) || [];
        
        if (orders.length === 0) {
            container.innerHTML = `
                <div class="section-box">
                    <h1>Administrace rezervací</h1>
                    <p style="color: #64748b; margin: 0;">Zatím nejsou žádné rezervace.</p>
                </div>`;
            return;
        }
        
        container.innerHTML = orders.map((order, index) => {
            const itemName = order.item || order.itemName || order.nazev || 'Předmět';
            const itemPrice = order.price || order.cena || '';
            const itemImage = order.image || order.fotka || '';

            return `
            <div class="section-box">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <div>
                        <h2 style="margin: 0; color: #1d4ed8;">Rezervace #${index + 1}</h2>
                        <small style="color: #64748b;">Odesláno: ${order.timestamp || 'Neznámo'}</small>
                    </div>
                    <div style="background: #eff6ff; padding: 8px 15px; border-radius: 8px; font-weight: bold; color: #1d4ed8;">
                        Termín: ${order.dateFrom} až ${order.dateTo}
                    </div>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                    <div style="border: 1px solid #e2e8f0; padding: 15px; border-radius: 12px;">
                        <h3 style="margin-top: 0; font-size: 16px; color: #475569;">ÚDAJE ZÁKAZNÍKA</h3>
                        <p><strong>Jméno:</strong> ${order.name}</p>
                        <p><strong>Telefon:</strong> <a href="tel:${order.phone}">${order.phone}</a></p>
                        <p><strong>E-mail:</strong> <a href="mailto:${order.email}">${order.email}</a></p>
                    </div>
                    
                    <div style="border: 1px solid #e2e8f0; padding: 15px; border-radius: 12px;">
                        <h3 style="margin-top: 0; font-size: 16px; color: #475569;">PŘEDMĚTY V REZERVACI</h3>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            ${itemImage ? `<img src="${itemImage}" style="width: 60px; height: 40px; object-fit: cover; border-radius: 4px;">` : ''}
                            <div><strong>${itemName}</strong> ${itemPrice ? `(${itemPrice})` : ''}</div>
                        </div>
                    </div>
                </div>

                <div style="text-align: right;">
                    <button type="button" onclick="deleteOrder(${index})" style="background: #fee2e2; color: #dc2626; padding: 8px 15px; font-size: 14px; width: auto;">Vyřídit / Smazat rezervaci</button>
                </div>
            </div>
        `;
        }).join('');
    }

    function deleteOrder(index) {
        let orders = JSON.parse(localStorage.getItem('rental_orders')) || [];
        orders.splice(index, 1);
        localStorage.setItem('rental_orders', JSON.stringify(orders));
        renderOrders();
    }

    function clearAllOrders() {
        if (confirm("Opravdu chcete smazat všechny rezervace?")) {
            localStorage.removeItem('rental_orders');
            renderOrders();
        }
    }

    function clearAllCatalog() {
        if (confirm("Opravdu chcete vymazat celý katalog?")) {
            localStorage.removeItem('rental_catalog');
            renderCatalog();
        }
    }

    // --- KATALOG ---
    function addItem() {
        const nameInput = document.getElementById('itemName');
        const priceInput = document.getElementById('itemPrice');
        const depositInput = document.getElementById('itemDeposit');
        const descInput = document.getElementById('itemDesc');
        const fileInput = document.getElementById('itemImage');
        
        const name = nameInput.value.trim();
        const price = priceInput.value.trim();
        const deposit = depositInput.value.trim();
        const desc = descInput.value.trim();
        
        if (!name) {
            alert("Vyplňte název položky!");
            return;
        }

        function saveToStorage(imageUrl = '') {
            const newItem = { 
                name: name, 
                price: price, 
                deposit: deposit, 
                desc: desc, 
                image: imageUrl 
            };
            
            try {
                let catalog = JSON.parse(localStorage.getItem('rental_catalog')) || [];
                catalog.push(newItem);
                localStorage.setItem('rental_catalog', JSON.stringify(catalog));
                
                nameInput.value = '';
                priceInput.value = '';
                depositInput.value = '';
                descInput.value = '';
                fileInput.value = '';

                renderCatalog();
            } catch (e) {
                alert("Úložiště prohlížeče je plné. Smažte prosím některé staré položky v katalogu.");
            }
        }

        if (fileInput.files && fileInput.files[0]) {
            resizeImage(fileInput.files[0], 500, 500, function(compressedDataUrl) {
                saveToStorage(compressedDataUrl);
            });
        } else {
            saveToStorage('');
        }
    }

    function renderCatalog() {
        const list = document.getElementById('catalog-list');
        let catalog = JSON.parse(localStorage.getItem('rental_catalog')) || [];
        
        if (catalog.length === 0) {
            list.innerHTML = '<p style="color: #64748b; margin: 0;">Zatím nejsou v katalogu žádné položky.</p>';
            return;
        }

        list.innerHTML = catalog.map((item, index) => `
            <div class="list-item">
                ${item.image ? `<img src="${item.image}" alt="${item.name}">` : '<div style="width:100px; height:70px; background:#e2e8f0; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#64748b; font-size:12px;">Bez foto</div>'}
                <div style="flex-grow: 1;">
                    <strong style="font-size: 16px; color: #1e293b;">${item.name}</strong><br>
                    <span style="color: #475569; font-size: 14px;"><strong>Cena:</strong> ${item.price} | <strong>Záloha:</strong> ${item.deposit}</span><br>
                    <small style="color: #64748b;">${item.desc}</small>
                </div>
                <button type="button" onclick="deleteItem(${index})" style="background: #ef4444; padding: 8px 14px; font-size: 13px; width: auto;">Smazat</button>
            </div>
        `).join('');
    }

    function deleteItem(index) {
        let catalog = JSON.parse(localStorage.getItem('rental_catalog')) || [];
        catalog.splice(index, 1);
        localStorage.setItem('rental_catalog', JSON.stringify(catalog));
        renderCatalog();
    }

    window.onload = function() { 
        renderOrders(); 
        renderCatalog(); 
    };
</script>
</body>
</html>
